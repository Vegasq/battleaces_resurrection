name: Source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14.8']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m tools.audit_repository --history
      - if: matrix.python-version == '3.14.8'
        run: powershell -File server/build_launcher.ps1
      - run: python -m unittest discover -s tests -v
